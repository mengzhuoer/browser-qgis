  else if(k === "delete" || k === "backspace"){ if(S.selected) removeLayer(S.selected); }
  else if(k === "escape"){ closeDropdown(); $("ctxMenu").classList.remove("show"); closeAddDialog(); }
  else if(k === "+" || k === "=") map.zoomIn();
  else if(k === "-") map.zoomOut();
});

// ---------------------------------------------------------------- 启动
// ---------------------------------------------------------------- 面板大小可调
// QGIS 桌面版能拖着面板边框改大小，网页版也该有：
//   * 左右两条侧栏的宽度
//   * 工具箱里「算法列表 / 参数区」之间的高度
// 尺寸存在 localStorage（刷新后还在）；双击把手恢复默认；方向键微调（无障碍）。

const UI_KEY = "gisds.ui";
const UI_DEF = {
  left:  () => (window.innerWidth < 1360 ? 238 : 264),
  right: () => (window.innerWidth < 1360 ? 348 : 392),
  algo:  () => 210,
};
const UI_MIN = {left: 170, right: 250, algo: 80};
const UI_MAX = {left: 620, right: 760, algo: 1400};

function uiClamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function uiLoad(){
  try{ return JSON.parse(localStorage.getItem(UI_KEY) || "{}") || {}; }catch(e){ return {}; }
}
function uiSave(s){
  try{ localStorage.setItem(UI_KEY, JSON.stringify(s)); }catch(e){}
}
function uiApply(s){
  const main = document.querySelector("main");
  if(main){
    main.style.setProperty("--w-left", s.left + "px");
    main.style.setProperty("--w-right", s.right + "px");
  }
  const list = document.getElementById("algoList");
  if(list) list.style.maxHeight = s.algo + "px";
  // 地图容器变了大小，得告诉 Leaflet 重算 —— 不然瓦片会错位/留白
  if(typeof map !== "undefined" && map && map.invalidateSize) map.invalidateSize();
}

function initResizable(){
  const main = document.querySelector("main");
  if(!main || !document.querySelector("aside.left") || !document.querySelector("aside.right")) return;

  const saved = uiLoad();
  const sizes = {
    left:  uiClamp(saved.left  !== undefined ? saved.left  : UI_DEF.left(),  UI_MIN.left,  UI_MAX.left),
    right: uiClamp(saved.right !== undefined ? saved.right : UI_DEF.right(), UI_MIN.right, UI_MAX.right),
    algo:  uiClamp(saved.algo  !== undefined ? saved.algo  : UI_DEF.algo(),  UI_MIN.algo,  UI_MAX.algo),
  };
  uiApply(sizes);

  // sign：把手往外拖，宽度是变大还是变小。
  //   左栏把手在右边缘 —— 往右拖，左栏变宽（+1）
  //   右栏把手在左边缘 —— 往右拖，右栏变窄（-1）
  //   横把手在算法列表下方 —— 往下拖，列表变高（+1）
  const bind = (grip, key, axis, sign) => {
    if(!grip) return;
    let start = 0, base = 0, raf = 0;
    const paint = () => {
      raf = 0;
      uiApply(sizes);
    };
    const onMove = (e) => {
      const cur = axis === "x" ? e.clientX : e.clientY;
      const d = (cur - start) * sign;
      sizes[key] = Math.round(uiClamp(base + d, UI_MIN[key], UI_MAX[key]));
      if(!raf) raf = requestAnimationFrame(paint);
    };
    const onUp = () => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.body.classList.remove("resizing", "row");
      grip.classList.remove("dragging");
      if(raf){ cancelAnimationFrame(raf); raf = 0; }
      uiApply(sizes);
      uiSave(sizes);
    };
    grip.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      start = axis === "x" ? e.clientX : e.clientY;
      base = sizes[key];
      grip.classList.add("dragging");
      document.body.classList.add("resizing");
      if(axis === "y") document.body.classList.add("row");
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
    grip.addEventListener("dblclick", () => {
      sizes[key] = Math.round(UI_DEF[key]());
      uiApply(sizes);
      uiSave(sizes);
    });
    grip.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 32 : 8;
      let d = 0;
      if(axis === "x"){
        if(e.key === "ArrowLeft") d = -step * sign;
        else if(e.key === "ArrowRight") d = step * sign;
      }else{
        if(e.key === "ArrowUp") d = -step * sign;
        else if(e.key === "ArrowDown") d = step * sign;
      }
      if(!d) return;
      e.preventDefault();
      sizes[key] = Math.round(uiClamp(sizes[key] + d, UI_MIN[key], UI_MAX[key]));
      uiApply(sizes);
      uiSave(sizes);
    });
  };

  bind(document.getElementById("gripLeft"), "left", "x", 1);
  bind(document.getElementById("gripRight"), "right", "x", -1);
  bind(document.getElementById("gripAlgo"), "algo", "y", 1);

  initDialogGrips();
}

// 「添加图层」对话框：整体大小（右下角把手）+ 左侧树宽度
function initDialogGrips(){
  const dlg = document.querySelector("#dlgAdd .dlg");
  const dlgBody = document.querySelector("#dlgAdd .dlg-body");
  const gAll = document.getElementById("gripDlgAdd");
  const gTree = document.getElementById("gripAddTree");

  if(dlg && gAll){
    let sx = 0, sy = 0, w0 = 0, h0 = 0;
    const move = (e) => {
      dlg.style.width = Math.max(360, w0 + (e.clientX - sx)) + "px";
      dlg.style.height = Math.max(260, h0 + (e.clientY - sy)) + "px";
    };
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.body.classList.remove("resizing");
      gAll.classList.remove("dragging");
    };
    gAll.addEventListener("pointerdown", (e) => {
      e.preventDefault(); e.stopPropagation();
      sx = e.clientX; sy = e.clientY;
      const r = dlg.getBoundingClientRect();
      w0 = r.width; h0 = r.height;
      gAll.classList.add("dragging");
      document.body.classList.add("resizing");
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
    });
    gAll.addEventListener("dblclick", () => { dlg.style.width = ""; dlg.style.height = ""; });
  }

  if(dlgBody && gTree){
    let sx = 0, base = 198;
    const move = (e) => {
      const v = uiClamp(base + (e.clientX - sx), 120, 460);
      dlgBody.style.setProperty("--dlg-tree", v + "px");
    };
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.body.classList.remove("resizing");
      gTree.classList.remove("dragging");
    };
    gTree.addEventListener("pointerdown", (e) => {
      e.preventDefault(); e.stopPropagation();
      sx = e.clientX;
      base = Math.round(document.getElementById("addTree").getBoundingClientRect().width);
      gTree.classList.add("dragging");
      document.body.classList.add("resizing");
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
    });
    gTree.addEventListener("dblclick", () => { dlgBody.style.removeProperty("--dlg-tree"); });
  }
}

async function boot(){
  tip("正在连接服务…");
  // 面板大小（左右侧栏宽度、工具箱内分割高度）—— 越早应用越好，
  // 免得页面先按默认宽度排一遍再跳一下。
  initResizable();
  // 先问**就绪**（/readyz）：它不碰数据目录，启动期间回 503。
  // 不先问它就直接调 /api/meta 的话，那会触发一次数据目录扫描、
  // 阻塞在 QGIS 工作线程上 —— 页面就卡在那儿不动了。
  try{
    await api("/readyz");
  }catch(e){
    const starting = /503/.test(e.message || "");
    // 灰点 = 还在启动（没 ok 也没 bad）
    $("statusDot").className = "dot";
    $("statusText").textContent = starting ? "服务启动中" : "无法连接服务";
    if(starting){
      tip("服务正在启动（PyQGIS 初始化、Processing 装载中），几秒后自动重试");
      setTimeout(() => location.reload(), 3000);
      return;
    }
    tip("无法连接服务：" + e.message);
    toast("无法连接服务：" + e.message);
    return;
  }
  // 先问服务端要不要登录
  try{
    const meta0 = await api("/api/meta");
    if(meta0.config && meta0.config.require_login && !sessionToken()){ goLogin(); return; }
  }catch(e){ /* 继续往下走，下面会报连接错误 */ }
  try{
    const [health, meta] = await Promise.all([api("/healthz"), api("/api/meta")]);
    $("statusDot").className = "dot ok";
    $("statusText").textContent = "服务正常";
    $("stQgis").textContent = health.qgis?.qgis_version || "?";
    $("stCrs").textContent = "EPSG:4326";
    // 算法数存一份（「关于本服务」要用，别写死 440 —— 插件会贡献算法）
    S.algoCount = meta.counts.processing_algorithms;
    tip("就绪 · " + meta.counts.datasets + " 个数据集 · " + meta.counts.processing_algorithms + " 个算法");
  }catch(e){
    $("statusDot").className = "dot bad";
    $("statusText").textContent = "无法连接服务";
    tip("无法连接服务：" + e.message);
    toast("无法连接服务：" + e.message);
    return;
  }
  const [dataRes, algoRes] = await Promise.allSettled([
    refreshData(),
    api("/api/processing/algorithms").then(a=>{
      S.algos = a.algorithms || [];
      S.algoGroups = a.groups || [];
      S.algoProviders = a.providers || [];
      renderAlgoList(S.algos.slice(0,120));
      const note = $("algoNote");
      if(note) note.textContent = `QGIS Processing 工具箱，共 ${S.algos.length} 个算法（中文名称来自 QGIS 官方翻译）。选算法 → 填参数 → 运行。`;
      // 空 provider（例如 GRASS 本体没装好）要在界面上说清楚，
      // 否则用户会以为是分组空了
      const empty = S.algoProviders.filter(p=>p.available === false);
      if(empty.length){
        const box = $("algoWarn");
        if(box){
          box.style.display = "";
          box.innerHTML = `⚠ 以下算法提供者未就绪，没有可用算法：`
            + empty.map(p=>`<b>${esc(p.name||p.id)}</b>（${esc(p.id)}）`).join("、")
            + `。`;
        }
      }
    }),
  ]);
  if(dataRes.status === "rejected") toast("数据加载失败：" + dataRes.reason.message);
  if(algoRes.status === "rejected"){
    $("algoList").innerHTML = `<div class="empty">算法清单加载失败：${esc(algoRes.reason.message)}</div>`;
  }
  updateStatusBar(null);
  setTool("pan");
  await initBasemap();
}
boot();
</script>
